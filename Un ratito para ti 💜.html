<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un ratito para ti 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#241552;--mist:#efe8ff;--ink:#2e1a63;--glow:#d9ccff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;color:var(--mist);font-family:'DM Sans',system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden;
background:radial-gradient(ellipse at 50% 0%,#7b5fd6 0,transparent 55%),linear-gradient(to bottom,var(--deep),#3a2380 60%,#6a4fc4)}
main{position:relative;z-index:1;width:100%;max-width:520px;padding:24px 18px 48px;display:flex;flex-direction:column;align-items:center;gap:20px;min-height:100vh;justify-content:center;text-align:center}
.hand{font-family:'Caveat',cursive;font-weight:700;margin:0;font-size:2.4rem;line-height:1.1}
p{margin:0;line-height:1.5}
.btn{font:700 1.05rem 'DM Sans',sans-serif;border:0;border-radius:999px;padding:13px 26px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#8a6ae6,#6a43d0);box-shadow:0 8px 22px rgba(106,67,208,.5);transition:transform .15s}
.btn:hover{transform:scale(1.04)}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.link{background:none;border:0;color:var(--glow);text-decoration:underline;font:inherit;cursor:pointer;opacity:.8}
.card{width:100%;background:linear-gradient(#f7f2ff,#ece3ff);color:var(--ink);border-radius:14px;padding:24px;font-family:'Caveat',cursive;font-size:1.6rem;line-height:1.3;box-shadow:0 20px 50px rgba(10,5,35,.5);animation:pop .6s ease-out}
.card p{margin-bottom:12px}
@keyframes pop{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.br{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#efe8ff,#8a6ae6);box-shadow:0 0 60px #b9a6f0;transform:scale(.6)}
#lab{font-family:'Caveat',cursive;font-size:2rem;min-height:1.3em}
.jar{font-size:4rem}
#note{min-height:130px;display:flex;align-items:center;justify-content:center}
.petal{position:fixed;top:-30px;pointer-events:none;animation:pf linear forwards;z-index:9}
@keyframes pf{to{transform:translateY(110vh) rotate(360deg)}}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:#8a5cf0;left:-90px;top:12%}
.o2{width:300px;height:300px;background:#c58bff;right:-90px;top:38%;animation-delay:-6s}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.moon{position:absolute;right:8%;top:5%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e9defe 60%,#cbb8f7);box-shadow:0 0 60px 20px rgba(217,204,255,.35)}
#field{position:absolute;left:0;bottom:0;width:100%;height:36%}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.orb,.star,.sw,.petal{animation:none!important}.card{animation:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main id="m"></main>
<script>
const q = new URLSearchParams(location.search);
const PARA = q.get('para') || '', DE = q.get('de') || 'Agustin';
const m = document.getElementById('m');
const show = h => { m.innerHTML = h; };
const $ = id => document.getElementById(id);
const notes = [
 'Hoy no tienes que ser fuerte, solo tienes que estar. Con eso ya es suficiente.',
 'Los días malos también pasan. Este también va a pasar.',
 'Eres más valioso de lo que te sientes ahora mismo.',
 'Puedes llorar, descansar o no hacer nada. Todo vale hoy.',
 'No tienes que explicarle nada a nadie si no quieres.',
 'Alguien está pensando en ti en este momento. Ese alguien soy yo 💜',
 'Mereces la misma ternura que tú les das a los demás.',
 'Un paso pequeño también es avanzar.',
 'Tu risa va a volver, y cuando vuelva mejora cualquier lugar.',
 'No estás solo con esto, aunque hoy se sienta así.'
];
let bag = [], alive = true;
function petals(n){
  const set = ['💜','🌸','✨','🪻'];
  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.className = 'petal'; s.textContent = set[i % 4];
    s.style.left = Math.random()*100 + 'vw'; s.style.fontSize = 16 + Math.random()*20 + 'px';
    s.style.animationDuration = 4 + Math.random()*4 + 's'; s.style.animationDelay = Math.random() + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 10000);
  }
}
function intro(){
  alive = true;
  show('<h1 class="hand" style="font-size:3rem">Hola' + (PARA ? ', ' + PARA : '') + ' 💜</h1><p>Supe que hoy no ha sido un buen día. Esto no es para arreglar nada, solo para acompañarte un ratito.</p><p>Sin apuro y sin tener que responder nada.</p><button class="btn" id="go">Quedarme un ratito</button>');
  $('go').onclick = breathe;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function breathe(){
  show('<h2 class="hand">Respira conmigo</h2><div class="br" id="br"></div><p id="lab">Prepárate…</p><button class="link" id="skip">Saltar</button>');
  const br = $('br'), lab = $('lab');
  $('skip').onclick = () => { alive = false; jar(); };
  await sleep(1200);
  for (let c = 0; c < 3 && alive; c++){
    lab.textContent = 'Inhala…'; br.style.transition = 'transform 4s ease-in-out'; br.style.transform = 'scale(1)';
    await sleep(4000); if (!alive) return;
    lab.textContent = 'Exhala despacito…'; br.style.transition = 'transform 6s ease-in-out'; br.style.transform = 'scale(.6)';
    await sleep(6000);
  }
  if (alive){ alive = false; lab.textContent = 'Muy bien 💜'; await sleep(1000); jar(); }
}
function jar(){
  show('<h2 class="hand">El frasco de cosas buenas</h2><div class="jar">🫙</div><p>Cada papelito es para ti. Saca los que quieras.</p><div id="note"></div><div><button class="btn" id="pick">Sacar un papelito</button></div><button class="link" id="end" style="margin-top:6px">Seguir</button>');
  $('pick').onclick = () => {
    if (!bag.length) bag = [...notes].sort(() => Math.random() - .5);
    $('note').innerHTML = '<div class="card">' + bag.pop() + '</div>';
    $('pick').textContent = 'Sacar otro';
  };
  $('end').onclick = finale;
}
function finale(){
  show('<h2 class="hand">Una cosa más</h2><div class="card" style="text-align:left"><p>No tienes que estar bien hoy. Está permitido estar triste, cansado o sin ganas de nada.</p><p>Solo quería que supieras que no estás solo con eso. Si quieres hablar, aquí estoy; si prefieres silencio, también está bien.</p><p>Y cuando quieras reírte, tengo los chistes malos listos 😄</p><p style="text-align:right;font-size:1.8rem;margin:8px 0 0">Con cariño,<br>' + DE + ' 💜</p></div><button class="btn" id="hug">Recibir un abrazo 🤗</button><p id="hm" aria-live="polite" style="min-height:1.5em;font-weight:700;color:var(--glow)"></p>');
  $('hug').onclick = () => { petals(50); $('hm').textContent = 'Abrazo enviado. Fuerte y sin soltar 💜'; };
}
function buildBg(){
  const R = (a, b) => a + Math.random() * (b - a);
  let h = '<i class="orb o1"></i><i class="orb o2"></i><i class="moon"></i>';
  for (let i = 0; i < 60; i++) h += '<i class="star" style="left:' + R(0,100) + '%;top:' + R(0,62) + '%;animation-delay:' + R(0,3) + 's;opacity:' + R(.4,1) + '"></i>';
  let v = '<svg id="field" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice"><path d="M0 130 Q100 100 200 125 T400 115 V200 H0Z" fill="#2d1a6e"/>';
  [[30,'#5b3fb0','#8a6ae6',45,80],[26,'#7e5cd6','#b9a6f0',32,62]].forEach(([n, st, bd, a, b]) => {
    for (let i = 0; i < n; i++){
      const x = R(0,400), t = R(a,b);
      v += '<g class="sw" style="animation-delay:-' + R(0,4) + 's"><path d="M' + x + ' 200 L' + x + ' ' + (200 - t) + '" stroke="' + st + '" stroke-width="1.2"/>';
      for (let k = 0; k < 5; k++) v += '<ellipse cx="' + x + '" cy="' + (200 - t + k * 6) + '" rx="2.6" ry="4.6" fill="' + bd + '"/>';
      v += '</g>';
    }
  });
  $('bg').innerHTML = h + v + '</svg>';
}
buildBg();
intro();
</script>
</body>
</html>

</body></html>
